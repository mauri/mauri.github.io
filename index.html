   <style>
      :root {
         color-scheme: dark;
         font-family: monospace;
      }
      body {
         padding: 1rem;
         display: flex;
         flex-direction: column;
         align-items: center;
      }
      .glitch {
         position: relative;
         display: inline-block;
         color: #fff;
         animation: glitch-base 1.4s infinite;
      }
      .glitch::before,
      .glitch::after {
         content: attr(data-text);
         position: absolute;
         top: 0;
         left: 0;
         white-space: pre;
      }
      .glitch::before {
         color: #0ff;
         clip-path: polygon(0 0, 100% 0, 100% 45%, 0 45%);
         animation: glitch-top 1.1s infinite;
      }
      .glitch::after {
         color: #f0f;
         clip-path: polygon(0 55%, 100% 55%, 100% 100%, 0 100%);
         animation: glitch-bot 1.6s infinite;
      }
      @keyframes glitch-base {
         0%, 18%, 100%  { transform: translate(0); }
         20%            { transform: translate(-3px, 2px); }
         21%            { transform: translate(3px, -2px); }
         22%            { transform: translate(0); }
         40%            { transform: translate(0); }
         41%            { transform: translate(2px, 3px); }
         42%            { transform: translate(-2px, -1px); }
         43%            { transform: translate(0); }
         60%            { transform: translate(0); }
         61%            { transform: translate(-4px, 1px); }
         62%            { transform: translate(4px, -2px); }
         63%            { transform: translate(-1px, 3px); }
         64%            { transform: translate(0); }
         80%            { transform: translate(0); }
         81%            { transform: translate(3px, -3px); }
         82%            { transform: translate(-3px, 2px); }
         83%            { transform: translate(0); }
      }
      @keyframes glitch-top {
         0%, 15%, 100%  { transform: translate(0) skewX(0); opacity: 1; }
         17%            { transform: translate(-6px, 0) skewX(-2deg); opacity: .7; }
         18%            { transform: translate(6px, 0) skewX(2deg); opacity: .9; }
         19%            { transform: translate(-2px, 0) skewX(0); opacity: 1; }
         20%            { transform: translate(0); opacity: 1; }
         35%            { transform: translate(0); opacity: 1; }
         36%            { transform: translate(5px, 0); opacity: .6; }
         37%            { transform: translate(-5px, 0); opacity: .8; }
         38%            { transform: translate(0); opacity: 1; }
         55%            { transform: translate(0); opacity: 1; }
         56%            { transform: translate(-8px, 0) skewX(3deg); opacity: .5; }
         57%            { transform: translate(8px, 0) skewX(-3deg); opacity: .8; }
         58%            { transform: translate(0); opacity: 1; }
         75%            { transform: translate(0); opacity: 1; }
         76%            { transform: translate(4px, 0); opacity: .7; }
         77%            { transform: translate(-4px, 0); opacity: .9; }
         78%            { transform: translate(0); opacity: 1; }
      }
      @keyframes glitch-bot {
         0%, 10%, 100%  { transform: translate(0) skewX(0); opacity: 1; }
         12%            { transform: translate(7px, 0) skewX(2deg); opacity: .6; }
         13%            { transform: translate(-7px, 0) skewX(-2deg); opacity: .8; }
         14%            { transform: translate(2px, 0); opacity: 1; }
         15%            { transform: translate(0); opacity: 1; }
         30%            { transform: translate(0); opacity: 1; }
         31%            { transform: translate(-5px, 0); opacity: .5; }
         32%            { transform: translate(5px, 0); opacity: .9; }
         33%            { transform: translate(0); opacity: 1; }
         50%            { transform: translate(0); opacity: 1; }
         51%            { transform: translate(9px, 0) skewX(-4deg); opacity: .4; }
         52%            { transform: translate(-9px, 0) skewX(4deg); opacity: .7; }
         53%            { transform: translate(3px, 0); opacity: .9; }
         54%            { transform: translate(0); opacity: 1; }
         70%            { transform: translate(0); opacity: 1; }
         71%            { transform: translate(-6px, 0); opacity: .6; }
         72%            { transform: translate(6px, 0); opacity: .8; }
         73%            { transform: translate(0); opacity: 1; }
      }
